const prompt=document.getElementById('prompt'),ex=document.getElementById('example'),speak=document.getElementById('speak');let choices=[],correctText='';
if(mode==='meaning'){prompt.textContent=current.word;ex.textContent='이 단어의 뜻은 무엇일까요?';speak.style.display='inline-block';choices=choicesFor(current,'meaning');correctText=current.meaning}
else if(mode==='listen'){prompt.textContent='어떤 단어일까요?';ex.textContent='🔊 버튼을 눌러 발음을 듣고 고르세요.';speak.style.display='inline-block';choices=choicesFor(current,'word');correctText=current.word;setTimeout(()=>speakCurrent(),250)}
else{prompt.textContent='가사 빈칸 맞히기';ex.textContent=current.example;speak.style.display='none';choices=choicesFor(current,'word');correctText=current.word}
const box=document.getElementById('answers');box.innerHTML='';choices.forEach(t=>{const b=document.createElement('button');b.className='answer';b.textContent=t;b.onclick=()=>check(b,t,correctText);box.appendChild(b)})}
function speakCurrent(){if(!current)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(current.word);u.lang='en-US';u.rate=.72;speechSynthesis.speak(u)}
function check(btn,selected,correctText){if(answered)return;answered=true;const all=[...document.querySelectorAll('.answer')];all.forEach(b=>b.disabled=true);if(selected===correctText){streak++;score+=100+Math.min(streak-1,4)*10;btn.classList.add('correct');document.getElementById('feedback').textContent=streak>=3?'🎉 정답! 연속 정답 보너스!':'✅ 정답!'}else{streak=0;lives--;btn.classList.add('wrong');all.forEach(b=>{if(b.textContent===correctText)b.classList.add('correct')});document.getElementById('feedback').textContent='정답: '+correctText}document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;document.getElementById('streak').textContent=streak;document.getElementById('next').style.display='inline-block';if(mode!=='listen')speakCurrent()}
function nextQuestion(){speechSynthesis.cancel();if(lives<=0||idx>=14)return finish();idx++;render()}
function finish(){document.getElementById('game').style.display='none';document.getElementById('result').style.display='block';document.getElementById('finalScore').textContent=score+'점';document.getElementById('resultText').textContent=score>=1500?'🏆 크리스마스 단어 마스터!':score>=1100?'🌟 아주 잘했어요!':score>=750?'🎄 좋아요! 한 번 더 하면 더 탄탄해져요.':'🎁 괜찮아요. 기초 모드부터 다시 해봐요!';const list=document.getElementById('wordlist');list.innerHTML='';questions.forEach(v=>{const d=document.createElement('div');d.className='worditem';d.innerHTML='<span class="tag">'+v.level+'</span> <b>'+v.word+'</b><br>'+v.meaning+'<br><small>'+v.song+'</small>';list.appendChild(d)})}

let studyIndex=0;
function startStudy(){studyIndex=0;document.getElementById('home').style.display='none';document.getElementById('game').style.display='none';document.getElementById('result').style.display='none';document.getElementById('study').style.display='block';buildStudyGrid();renderStudy();}
function leaveStudy(){speechSynthesis.cancel();document.getElementById('study').style.display='none';document.getElementById('home').style.display='block';}
function buildStudyGrid(){const g=document.getElementById('studyGrid');g.innerHTML='';vocab.forEach((v,i)=>{const b=document.createElement('button');b.className='studyDot';b.textContent=i+1;b.onclick=()=>{studyIndex=i;renderStudy();window.scrollTo({top:0,behavior:'smooth'});};g.appendChild(b);});}
function renderStudy(){const v=vocab[studyIndex];document.getElementById('studyNum').textContent=(studyIndex+1)+' / '+vocab.length;document.getElementById('studyCount').textContent=studyIndex+1;document.getElementById('studyBar').style.width=((studyIndex+1)/vocab.length*100)+'%';document.getElementById('studyLevel').textContent=v.level;document.getElementById('studyWord').textContent=v.word;document.getElementById('studyMeaning').textContent=v.meaning;document.getElementById('studySong').textContent='♪ '+v.song;document.getElementById('studyExample').textContent=v.example.replaceAll('___',v.word);document.getElementById('studyComplete').style.display=(studyIndex===vocab.length-1)?'block':'none';[...document.querySelectorAll('.studyDot')].forEach((b,i)=>b.classList.toggle('active',i===studyIndex));}
function speakStudy(){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(vocab[studyIndex].word);u.lang='en-US';u.rate=.72;speechSynthesis.speak(u);}
function nextStudy(){speechSynthesis.cancel();if(studyIndex<vocab.length-1){studyIndex++;renderStudy();}else{document.getElementById('studyComplete').style.display='block';}}
function prevStudy(){speechSynthesis.cancel();if(studyIndex>0){studyIndex--;renderStudy();}}

window.addEventListener('beforeunload',()=>speechSynthesis.cancel());
</script>
</body></html>
